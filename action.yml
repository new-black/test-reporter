name: Test Reporter
description: |
  Shows test results in GitHub UI: .NET (xUnit, NUnit, MSTest) via TRX format
author: Michal Dorner <dorner.michal@gmail.com>
inputs:
  name:
    description: Name of the check run
    required: true
  path:
    description: |
      Comma-separated list of paths to test results
      Supports wildcards via [fast-glob](https://github.com/mrmlnc/fast-glob)
      All matched result files must be of same format
    required: true
  list-suites:
    description: |
      Limits which test suites are listed. Supported options:
        - all
        - failed
    required: false
    default: 'all'
  list-tests:
    description: |
      Limits which test cases are listed. Supported options:
        - all
        - failed
    required: false
    default: 'all'
  max-annotations:
    description: |
      Limits number of created annotations with error message and stack trace captured during test execution.
      Must be less or equal to 50.
    required: false
    default: '10'
  fail-on-error:
    description: Set this action as failed if test report contain any failed test
    required: false
    default: 'true'
  fail-on-empty:
    description: Set this action as failed if no test results were found
    required: false
    default: 'true'
  token:
    description: GitHub Access Token
    required: false
    default: ${{ github.token }}
  checks-token:
    description: |
      Token used only for Checks API calls (creating and updating the check run).
      Use a GitHub App installation token to attach the check run to the app's own
      check suite instead of a workflow's. Defaults to `token`.
    required: false
    default: ''
  slack-url:
    description: Slack webhook url
    required: false
    default: ''
  slack-branch:
    description: Branch name to send Slack notifications for (default 'master')
    required: false
    default: 'master'
  test-results-endpoint:
    description: Test results endpoint for uploading TRX files. Must end with a slash, as `TestResults` is appended to it.
    required: false
    default: ''
  test-results-endpoint-secret:
    description: Test results endpoint secret
    required: false
    default: ''
  test-results-type:
    description: Type of test run (integration, auditing, watchtower, watchtower-io)
    required: false
    default: 'integration'
  test-results-db-type:
    description: Database type (mssql, yugabyte, postgres) — used for PR failure comments
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  color: blue
  icon: file-text
